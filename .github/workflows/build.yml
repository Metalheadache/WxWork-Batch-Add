name: build-exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: 打包 exe
        run: python -m PyInstaller wxwork_batch_add.spec --noconfirm --clean

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WxWorkBatchAdd
          path: dist/WxWorkBatchAdd.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/WxWorkBatchAdd.exe
